<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  
  <!-- Carga de Three.js y GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Fondo elegante con degradado central */
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Contenedor del escenario 3D -->
  <div id="canvas-container"></div>

  <script>
    // 1. Crear Escena y Renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // 2. Cámara enfocada en cuerpo completo (distancia de 3.8m)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.2, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 3. Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // 4. Base circular en el suelo
    const floorGeo = new THREE.CircleGeometry(1.2, 32);
    const floorMat = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.25 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.3;
    scene.add(floor);

    // 5. Grupo del Avatar
    const avatarGroup = new THREE.Group();
    scene.add(avatarGroup);

    // Variables globales para extremidades, rostro y animación de saludo
    let isSpeaking = false;
    let isWaving = false; // Control de saludo con la mano
    let armLeft, armRight, headMesh;

    // Intentar cargar 'avatar.glb' o mostrar figura de respaldo femenina
    const loader = new THREE.GLTFLoader();
    loader.load('avatar.glb', (gltf) => {
      const model = gltf.scene;
      model.position.set(0, -1.2, 0);
      avatarGroup.add(model);
    }, undefined, () => {
      createFemaleAvatar();
    });

    // Construcción del Avatar Femenino de Cuerpo Completo con Rostro
    function createFemaleAvatar() {
      const dressMat = new THREE.MeshStandardMaterial({ color: 0xdb2777, roughness: 0.3 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.3 });
      const faceDetailMat = new THREE.MeshBasicMaterial({ color: 0x1e1b4b }); // Color para los detalles del rostro
      const mouthMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

      // Cabeza
      headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), skinMat);
      headMesh.position.y = 0.75;
      avatarGroup.add(headMesh);

      // DETALLES DEL ROSTRO (Ojos y Sonrisa)
      const eyeGeo = new THREE.SphereGeometry(0.02, 16, 16);
      
      const eyeLeft = new THREE.Mesh(eyeGeo, faceDetailMat);
      eyeLeft.position.set(-0.06, 0.78, 0.16);
      avatarGroup.add(eyeLeft);

      const eyeRight = new THREE.Mesh(eyeGeo, faceDetailMat);
      eyeRight.position.set(0.06, 0.78, 0.16);
      avatarGroup.add(eyeRight);

      // Sonrisa
      const mouthGeo = new THREE.TorusGeometry(0.035, 0.008, 16, 100, Math.PI);
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, 0.71, 0.16);
      mouth.rotation.x = Math.PI; // Orientación curva sonriente
      avatarGroup.add(mouth);

      // Cabello largo
      const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.20, 32, 32), hairMat);
      hairTop.position.set(0, 0.78, -0.02);
      avatarGroup.add(hairTop);

      const hairBack = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.6, 32), hairMat);
      hairBack.position.set(0, 0.55, -0.08);
      avatarGroup.add(hairBack);

      // Torso / Vestido
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.35, 32), dressMat);
      top.position.y = 0.4;
      avatarGroup.add(top);

      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.28, 0.6, 32), dressMat);
      skirt.position.y = -0.05;
      avatarGroup.add(skirt);

      // Brazos articulados
      armLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.55), skinMat);
      armLeft.position.set(-0.19, 0.3, 0);
      armLeft.rotation.z = 0.15;
      avatarGroup.add(armLeft);

      armRight = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.55), skinMat);
      armRight.position.set(0.19, 0.3, 0);
      armRight.rotation.z = -0.15;
      avatarGroup.add(armRight);

      // Piernas
      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.025, 0.75), skinMat);
      legL.position.set(-0.08, -0.65, 0);
      avatarGroup.add(legL);

      const legR = legL.clone();
      legR.position.x = 0.08;
      avatarGroup.add(legR);

      avatarGroup.position.y = -0.1;
    }

    // Función para activar el saludo con la mano
    function triggerWaveHand() {
      isWaving = true;
      setTimeout(() => {
        isWaving = false;
      }, 3000); // Saluda durante 3 segundos
    }

    // 6. Animación de renderizado y movimiento por voz / saludo
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Respiración y flotación suave constante
      avatarGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.03 - 0.2;

      if (isWaving && armRight) {
        // Movimiento de saludo elevando y moviendo el brazo derecho
        armRight.position.set(0.25, 0.5, 0);
        armRight.rotation.z = -2.2; 
        armRight.rotation.x = Math.sin(elapsedTime * 10) * 0.4; // Movimiento dinámico de la mano
      } else if (isSpeaking) {
        // Gesticulación al hablar
        avatarGroup.rotation.y = Math.sin(elapsedTime * 4) * 0.08;
        if (headMesh) headMesh.position.y = 0.75 + Math.sin(elapsedTime * 8) * 0.015;
        if (armLeft) armLeft.rotation.x = Math.sin(elapsedTime * 5) * 0.2;
        if (armRight) {
          armRight.position.set(0.19, 0.3, 0);
          armRight.rotation.z = -0.15;
          armRight.rotation.x = -Math.sin(elapsedTime * 5) * 0.2;
        }
      } else {
        // Estado de reposo
        avatarGroup.rotation.y = Math.sin(elapsedTime * 0.5) * 0.05;
        if (headMesh) headMesh.position.y = 0.75;
        if (armLeft) armLeft.rotation.x = 0;
        if (armRight) {
          armRight.position.set(0.19, 0.3, 0);
          armRight.rotation.z = -0.15;
          armRight.rotation.x = 0;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // 7. Redimensionar al cambiar tamaño de pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RECONOCIMIENTO DE VOZ Y DETECCIÓN DE SALUDO ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      window.addEventListener('click', () => {
        try { recognition.start(); } catch(e){}
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        
        // Si detecta el saludo o pregunta por su estado, saluda con la mano
        if (text.includes('hola') || text.includes('cómo estás') || text.includes('como estas')) {
          triggerWaveHand();
        }
      };
    }
  </script>
</body>
</html>
