<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  
  <!-- Carga de Three.js y GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .voice-ui {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mic-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: #ffffff;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(236, 72, 153, 0.6);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }

    .mic-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 45px rgba(236, 72, 153, 0.9);
    }

    .mic-btn.active {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 0 45px rgba(239, 68, 68, 0.9);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 14px;
      color: #e2e8f0;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 20px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="voice-ui">
    <button id="mic-btn" class="mic-btn" title="Haz clic para activar y hablar">🎤</button>
    <div id="status-text" class="status-text">Presiona el micrófono para hablar</div>
  </div>

  <script>
    const GROQ_API_KEY = "PEGA_AQUI_TU_API_KEY_DE_GROQ"; 

    // 1. ESCENA 3D Y CÁMARA
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Alejamos la cámara a 4.2 metros para ver el cuerpo entero y el piso
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.2, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 2. ILUMINACIÓN
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // 3. PISO CON PLATAFORMA Y CUADRÍCULA FUTURISTA
    const floorY = -1.1;

    // Disco brillante neón en el centro
    const floorCenterGeo = new THREE.CircleGeometry(1.5, 64);
    const floorCenterMat = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.35 });
    const floorCenter = new THREE.Mesh(floorCenterGeo, floorCenterMat);
    floorCenter.rotation.x = -Math.PI / 2;
    floorCenter.position.y = floorY;
    scene.add(floorCenter);

    // Cuadrícula 3D para darle efecto de suelo completo
    const gridHelper = new THREE.GridHelper(10, 20, 0x8b5cf6, 0x334155);
    gridHelper.position.y = floorY - 0.01;
    scene.add(gridHelper);

    // 4. AVATAR
    const avatarGroup = new THREE.Group();
    scene.add(avatarGroup);

    let isSpeaking = false;
    let armLeft, armRight, headMesh;

    const loader = new THREE.GLTFLoader();
    loader.load('avatar.glb', (gltf) => {
      const model = gltf.scene;
      model.position.set(0, floorY, 0);
      avatarGroup.add(model);
    }, undefined, () => {
      createFemaleAvatar();
    });

    function createFemaleAvatar() {
      const dressMat = new THREE.MeshStandardMaterial({ color: 0xdb2777, roughness: 0.3 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x312e81, roughness: 0.3 });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
      const mouthMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

      // Cabeza y Rostro
      headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), skinMat);
      headMesh.position.y = 0.75;
      avatarGroup.add(headMesh);

      const eyeGeo = new THREE.SphereGeometry(0.02, 16, 16);
      const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
      eyeLeft.position.set(-0.06, 0.78, 0.16);
      avatarGroup.add(eyeLeft);

      const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
      eyeRight.position.set(0.06, 0.78, 0.16);
      avatarGroup.add(eyeRight);

      const mouthGeo = new THREE.TorusGeometry(0.035, 0.007, 16, 50, Math.PI);
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, 0.71, 0.16);
      mouth.rotation.x = Math.PI;
      avatarGroup.add(mouth);

      // Cabello
      const hairTop = new THREE.Mesh(new THREE.SphereGeometry(0.20, 32, 32), hairMat);
      hairTop.position.set(0, 0.78, -0.02);
      avatarGroup.add(hairTop);

      const hairBack = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.6, 32), hairMat);
      hairBack.position.set(0, 0.55, -0.08);
      avatarGroup.add(hairBack);

      // Cuerpo
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.35, 32), dressMat);
      top.position.y = 0.4;
      avatarGroup.add(top);

      const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.28, 0.6, 32), dressMat);
      skirt.position.y = -0.05;
      avatarGroup.add(skirt);

      // Extremidades
      armLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.55), skinMat);
      armLeft.position.set(-0.19, 0.3, 0);
      armLeft.rotation.z = 0.15;
      avatarGroup.add(armLeft);

      armRight = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.55), skinMat);
      armRight.position.set(0.19, 0.3, 0);
      armRight.rotation.z = -0.15;
      avatarGroup.add(armRight);

      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.025, 0.75), skinMat);
      legL.position.set(-0.08, -0.65, 0);
      avatarGroup.add(legL);

      const legR = legL.clone();
      legR.position.x = 0.08;
      avatarGroup.add(legR);

      // Tamaño ajustado para que quepa bien en pantalla con el piso
      avatarGroup.scale.set(1.0, 1.0, 1.0);
      avatarGroup.position.y = -0.1;
    }

    // 5. ANIMACIÓN
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      avatarGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.03 - 0.1;

      if (isSpeaking) {
        avatarGroup.rotation.y = Math.sin(elapsedTime * 4) * 0.08;
        if (headMesh) headMesh.position.y = 0.75 + Math.sin(elapsedTime * 8) * 0.015;
        if (armLeft) armLeft.rotation.x = Math.sin(elapsedTime * 5) * 0.2;
        if (armRight) armRight.rotation.x = -Math.sin(elapsedTime * 5) * 0.2;
      } else {
        avatarGroup.rotation.y = Math.sin(elapsedTime * 0.5) * 0.05;
        if (headMesh) headMesh.position.y = 0.75;
        if (armLeft) armLeft.rotation.x = 0;
        if (armRight) armRight.rotation.x = 0;
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 6. PROCESAMIENTO DE VOZ
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      statusText.innerText = "Navegador no soporta micrófono. Usa Chrome o Edge.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      let isListening = false;

      micBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!isListening) {
          window.speechSynthesis.resume();
          recognition.start();
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('active');
        statusText.innerText = "Te escucho... habla ahora.";
      };

      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        statusText.innerText = "Pensando respuesta...";
        await askAI(transcript);
      };

      recognition.onerror = () => {
        statusText.innerText = "No te entendí. Intenta de nuevo.";
        resetMic();
      };

      recognition.onend = () => {
        resetMic();
      };

      function resetMic() {
        isListening = false;
        micBtn.classList.remove('active');
      }
    }

    async function askAI(userPrompt) {
      if (!GROQ_API_KEY || GROQ_API_KEY === "PEGA_AQUI_TU_API_KEY_DE_GROQ") {
        speak("Por favor agrega tu clave API de Groq en el código para activar mi cerebro.");
        return;
      }

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.1-8b-instant",
            messages: [
              { role: "system", content: "Eres una asistente virtual muy amable, inteligente y concisa. Responde siempre en español en menos de 2 oraciones." },
              { role: "user", content: userPrompt }
            ]
          })
        });

        const data = await res.json();
        const aiResponse = data.choices[0].message.content;
        speak(aiResponse);
      } catch (error) {
        console.error(error);
        speak("Ocurrió un error al procesar tu pregunta.");
      }
    }

    function speak(text) {
      statusText.innerText = "Hablando...";
      isSpeaking = true;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      utterance.pitch = 1.2;

      utterance.onend = () => {
        statusText.innerText = "Presiona el micrófono para hablar";
        isSpeaking = false;
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
