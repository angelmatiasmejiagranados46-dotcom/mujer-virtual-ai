<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  
  <!-- Carga de Three.js para la renderización 3D y GLTFLoader para el modelo .glb -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Contenedor principal centrado del avatar */
    .avatar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Canvas 3D que ocupará el centro para el avatar de cuerpo completo */
    #avatar-3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Control flotante inferior para voz */
    .voice-controls {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Botón flotante del micrófono */
    .mic-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }

    .mic-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.7);
    }

    .mic-btn.recording {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Indicador de estado del micrófono */
    .status-text {
      font-size: 14px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="avatar-container">
    <!-- Visor 3D del Avatar -->
    <div id="avatar-3d"></div>

    <!-- Controles de voz únicamente -->
    <div class="voice-controls">
      <button id="mic-btn" class="mic-btn" title="Presiona para hablar">
        🎤
      </button>
      <span id="status-text" class="status-text">Presiona para hablar</span>
    </div>
  </div>

  <script>
    // Inicialización del visor 3D con Three.js
    const container = document.getElementById('avatar-3d');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 3); // Posición ajustada para vista de cuerpo completo

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Iluminación para resaltar el modelo
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 4, 2);
    scene.add(dirLight);

    // Reajuste de pantalla si cambia el tamaño de la ventana
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Bucle de renderizado
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Lógica del botón de micrófono
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');
    let isRecording = false;

    micBtn.addEventListener('click', () => {
      isRecording = !isRecording;
      if (isRecording) {
        micBtn.classList.add('recording');
        statusText.innerText = 'Escuchando...';
      } else {
        micBtn.classList.remove('recording');
        statusText.innerText = 'Presiona para hablar';
      }
    });
  </script>

</body>
</html>
