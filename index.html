<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  
  <!-- Carga de Three.js y GLTFLoader para el avatar 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Fondo moderno con degradado elegante */
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Contenedor del Avatar 3D de cuerpo completo en el centro */
    .avatar-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #avatar-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Control exclusivo de voz flotante */
    .voice-interface {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .mic-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: #ffffff;
      font-size: 34px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }

    .mic-button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.9);
    }

    .mic-button.active {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.9);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status-label {
      font-size: 15px;
      font-weight: 500;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.75);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="avatar-wrapper">
    <!-- Contenedor 3D -->
    <div id="avatar-canvas"></div>

    <!-- Interfaz única de voz -->
    <div class="voice-interface">
      <button id="mic-btn" class="mic-button" title="Hablar">🎤</button>
      <span id="status-tag" class="status-label">Presiona para hablar</span>
    </div>
  </div>

  <script>
    // Inicialización del visor 3D
    const container = document.getElementById('avatar-canvas');
    const scene = new THREE.Scene();

    // Cámara configurada para enfocar el cuerpo completo
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.1, 3.2); // Posición centrada y distanciada para el cuerpo entero

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Iluminación del escenario
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(3, 5, 3);
    scene.add(dirLight);

    // Ajuste responsive en cambios de tamaño
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Bucle de animación
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      renderer.render(scene, camera);
    }
    renderLoop();

    // Eventos del botón de micrófono
    const micBtn = document.getElementById('mic-btn');
    const statusTag = document.getElementById('status-tag');
    let listening = false;

    micBtn.addEventListener('click', () => {
      listening = !listening;
      if (listening) {
        micBtn.classList.add('active');
        statusTag.innerText = 'Escuchando...';
      } else {
        micBtn.classList.remove('active');
        statusTag.innerText = 'Presiona para hablar';
      }
    });
  </script>

</body>
</html>
