<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 1000px;
      height: 80vh;
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        height: 95vh;
      }
    }

    /* Panel Izquierdo: Avatar */
    .avatar-panel {
      flex: 1;
      background: linear-gradient(135deg, #1e1b4b, #311b92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      border-right: 1px solid #334155;
    }

    .avatar-box {
      width: 200px;
      height: 250px;
      border-radius: 50px;
      background: #0f172a;
      border: 2px solid #6366f1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      transition: all 0.3s ease;
    }

    .avatar-box.thinking {
      border-color: #f59e0b;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
    }

    .avatar-box.speaking {
      border-color: #10b981;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .avatar-icon {
      font-size: 80px;
    }

    .avatar-status {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 10px;
    }

    .avatar-panel h2 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .avatar-panel p {
      font-size: 14px;
      color: #94a3b8;
    }

    /* Panel Derecho: Conversación */
    .chat-panel {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      background-color: #0f172a;
    }

    .chat-header {
      padding: 20px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
    }

    .chat-header h3 {
      font-size: 18px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: #6366f1;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      padding: 15px 20px;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .chat-input-area input:focus {
      border-color: #6366f1;
    }

    .btn {
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #4f46e5;
    }

    .btn-icon {
      background-color: #334155;
      padding: 12px;
      border-radius: 8px;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .btn-icon:hover {
      background-color: #475569;
    }

    .btn-icon.recording {
      background-color: #ef4444;
      animation: pulse 1s infinite;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Panel Avatar -->
    <div class="avatar-panel">
      <div class="avatar-box" id="avatarBox">
        <div class="avatar-icon">👩‍💼</div>
        <div class="avatar-status" id="avatarStatus">Lista para conversar</div>
      </div>
      <h2>Mujer Virtual</h2>
      <p>Tu asistente virtual inteligente</p>
    </div>

    <!-- Panel Chat -->
    <div class="chat-panel">
      <div class="chat-header">
        <h3>Conversación</h3>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="message assistant">Hola, soy tu asistente virtual. ¿En qué puedo ayudarte hoy?</div>
      </div>
      <div class="chat-input-area">
        <button class="btn-icon" id="micBtn" title="Hablar con micrófono">🎤</button>
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
        <button class="btn" id="sendBtn" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const avatarBox = document.getElementById('avatarBox');
    const avatarStatus = document.getElementById('avatarStatus');
    const micBtn = document.getElementById('micBtn');

    function setAvatarState(state) {
      avatarBox.className = 'avatar-box';
      if (state === 'thinking') {
        avatarBox.classList.add('thinking');
        avatarStatus.innerText = 'Pensando respuesta...';
      } else if (state === 'speaking') {
        avatarBox.classList.add('speaking');
        avatarStatus.innerText = 'Hablando...';
      } else if (state === 'listening') {
        avatarBox.classList.add('thinking');
        avatarStatus.innerText = 'Escuchando...';
      } else {
        avatarStatus.innerText = 'Lista para conversar';
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';
      setAvatarState('thinking');

      try {
const response = await fetch('https://mujer-virtual-ai.vercel.app/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        const reply = data.reply || 'No pude obtener una respuesta.';

        addMessage(reply, 'assistant');
        speakText(reply);
      } catch (error) {
        addMessage('Ocurrió un error al conectar con la IA.', 'assistant');
        setAvatarState('idle');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) {
        setAvatarState('idle');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';

      utterance.onstart = () => setAvatarState('speaking');
      utterance.onend = () => setAvatarState('idle');
      utterance.onerror = () => setAvatarState('idle');

      window.speechSynthesis.speak(utterance);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';

      micBtn.addEventListener('click', () => {
        recognition.start();
      });

      recognition.onstart = () => {
        micBtn.classList.add('recording');
        setAvatarState('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendMessage();
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    } else {
      micBtn.style.display = 'none';
    }
  </script>
</body>
</html>
