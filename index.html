<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #181818;
      border-bottom: 1px solid #303030;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      color: #8cff9b;
      font-size: 14px;
    }

    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .avatar-area {
      width: 60%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #242424, #101010);
      overflow: hidden;
    }

    .avatar-placeholder {
      width: 260px;
      height: 520px;
      border-radius: 130px 130px 80px 80px;
      background: linear-gradient(180deg, #777, #292929);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: #ddd;
      font-size: 18px;
    }

    .avatar-label {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(0,0,0,.55);
      padding: 10px 16px;
      border-radius: 12px;
    }

    .chat-area {
      width: 40%;
      display: flex;
      flex-direction: column;
      background: #191919;
      border-left: 1px solid #303030;
    }

    .chat-header {
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #303030;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #292929;
      line-height: 1.4;
    }

    .message.ai {
      background: #343434;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid #303030;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #292929;
      color: white;
      outline: none;
    }

    .input-area button {
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 800px) {
      .main {
        flex-direction: column;
      }

      .avatar-area,
      .chat-area {
        width: 100%;
      }

      .avatar-area {
        height: 60%;
      }

      .chat-area {
        height: 40%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div class="logo">Mujer Virtual AI</div>
      <div class="status">● Lista</div>
    </header>

    <main class="main">

      <section class="avatar-area">

        <div class="avatar-placeholder">
          Aquí aparecerá<br>
          tu avatar virtual
        </div>

        <div class="avatar-label">
          Presentadora virtual
        </div>

      </section>

      <section class="chat-area">

        <div class="chat-header">
          Conversación
        </div>

        <div class="messages" id="messages">

          <div class="message ai">
            Hola. Soy tu asistente virtual. ¿En qué puedo ayudarte?
          </div>

        </div>

        <div class="input-area">
          <input
            id="userInput"
            type="text"
            placeholder="Escribe tu pregunta..."
          >

          <button onclick="sendMessage()">
            Enviar
          </button>
        </div>

      </section>

    </main>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");

      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message";
      userMessage.textContent = text;

      messages.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "Esta es una demostración. Más adelante conectaremos aquí la inteligencia artificial y la voz.";

      messages.appendChild(aiMessage);

      messages.scrollTop = messages.scrollHeight;
    }

    document
      .getElementById("userInput")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
