<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujer Virtual AI</title>
  
  <!-- Carga de Three.js y GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Fondo elegante con degradado central */
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Contenedor del escenario 3D -->
  <div id="canvas-container"></div>

  <script>
    // 1. Crear Escena y Renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // 2. Cámara enfocada en cuerpo completo (distancia de 3.8m)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0.2, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // 3. Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // 4. Base circular en el suelo
    const floorGeo = new THREE.CircleGeometry(1.2, 32);
    const floorMat = new THREE.MeshBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.25 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.3;
    scene.add(floor);

    // 5. Grupo del Avatar
    const avatarGroup = new THREE.Group();
    scene.add(avatarGroup);

    // Intentar cargar 'avatar.glb' o mostrar figura de respaldo
    const loader = new THREE.GLTFLoader();
    loader.load('avatar.glb', (gltf) => {
      const model = gltf.scene;
      model.position.set(0, -1.2, 0);
      avatarGroup.add(model);
    }, undefined, () => {
      // Figura 3D completa visible si no se encuentra avatar.glb
      const mat = new THREE.MeshStandardMaterial({ color: 0xc7d2fe, roughness: 0.3 });
      
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 32), mat);
      head.position.y = 0.7;
      avatarGroup.add(head);

      const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.12, 0.7, 32), mat);
      torso.position.y = 0.2;
      avatarGroup.add(torso);

      const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6), mat);
      armL.position.set(-0.26, 0.2, 0);
      avatarGroup.add(armL);

      const armR = armL.clone();
      armR.position.x = 0.26;
      avatarGroup.add(armR);

      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.8), mat);
      legL.position.set(-0.1, -0.55, 0);
      avatarGroup.add(legL);

      const legR = legL.clone();
      legR.position.x = 0.1;
      avatarGroup.add(legR);

      avatarGroup.position.y = -0.2;
    });

    // 6. Animación de renderizado
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      avatarGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.03 - 0.2;
      avatarGroup.rotation.y = Math.sin(elapsedTime * 0.5) * 0.05;
      renderer.render(scene, camera);
    }
    animate();

    // 7. Redimensionar al cambiar tamaño de pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
