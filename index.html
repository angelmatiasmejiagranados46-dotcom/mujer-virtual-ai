<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mujer Virtual AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #181818;
    border-bottom: 1px solid #333;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.status {
    color: #55ff70;
    font-size: 15px;
}

.contenedor {
    display: grid;
    grid-template-columns: 45% 55%;
    height: calc(100vh - 70px);
}

.avatar-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #222, #111);
}

.avatar {
    width: 330px;
    height: 500px;
    border-radius: 170px 170px 50px 50px;
    background: linear-gradient(180deg, #777, #292929);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 23px;
    color: #ddd;
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
}

.avatar p {
    padding: 30px;
}

.nombre {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
}

.descripcion {
    color: #aaa;
    margin-top: 8px;
}

.chat {
    display: flex;
    flex-direction: column;
    background: #151515;
}

.chat-header {
    padding: 25px;
    border-bottom: 1px solid #333;
}

.chat-header h2 {
    margin: 0 0 7px;
}

.chat-header p {
    margin: 0;
    color: #aaa;
}

.mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.mensaje {
    max-width: 75%;
    padding: 15px 18px;
    border-radius: 18px;
    margin-bottom: 15px;
    line-height: 1.5;
}

.bot {
    background: #303030;
    margin-right: auto;
}

.usuario {
    background: #555;
    margin-left: auto;
}

.escribiendo {
    color: #aaa;
    font-style: italic;
    display: none;
}

.entrada {
    display: flex;
    gap: 10px;
    padding: 20px;
    border-top: 1px solid #333;
}

.entrada input {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 12px;
    outline: none;
    background: #292929;
    color: white;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    background: white;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: scale(1.03);
}

.boton-voz {
    background: #333;
    color: white;
    font-size: 18px;
}

@media (max-width: 800px) {

    header {
        padding: 0 15px;
    }

    .contenedor {
        grid-template-columns: 1fr;
        height: auto;
    }

    .avatar-area {
        min-height: 500px;
        padding: 30px;
    }

    .avatar {
        width: 230px;
        height: 350px;
    }

    .chat {
        min-height: 600px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Mujer Virtual AI</div>
    <div class="status">● Lista</div>
</header>

<div class="contenedor">

    <section class="avatar-area">

        <div class="avatar">
            <p>👩<br><br>
            Aquí aparecerá<br>
            tu avatar virtual</p>
        </div>

        <div class="nombre">Mujer Virtual</div>
        <div class="descripcion">Tu asistente virtual inteligente</div>

    </section>


    <section class="chat">

        <div class="chat-header">
            <h2>Conversación</h2>
            <p>Habla conmigo o escribe un mensaje.</p>
        </div>

        <div class="mensajes" id="mensajes">

            <div class="mensaje bot">
                Hola 👋 Soy tu asistente virtual. ¿En qué puedo ayudarte?
            </div>

            <div class="mensaje escribiendo" id="escribiendo">
                La asistente está escribiendo...
            </div>

        </div>

        <div class="entrada">

            <button class="boton-voz" onclick="hablar()">🎤</button>

            <input
                type="text"
                id="entrada"
                placeholder="Escribe tu pregunta..."
                onkeydown="teclaEnter(event)"
            >

            <button onclick="enviarMensaje()">
                Enviar
            </button>

        </div>

    </section>

</div>


<script>

function enviarMensaje() {

    const entrada = document.getElementById("entrada");
    const texto = entrada.value.trim();

    if (texto === "") {
        return;
    }

    agregarMensaje(texto, "usuario");

    entrada.value = "";

    document.getElementById("escribiendo").style.display = "block";

    setTimeout(function() {

        document.getElementById("escribiendo").style.display = "none";

        const respuesta = generarRespuesta(texto);

        agregarMensaje(respuesta, "bot");

        hablarTexto(respuesta);

    }, 700);
}


function agregarMensaje(texto, tipo) {

    const mensajes = document.getElementById("mensajes");

    const mensaje = document.createElement("div");

    mensaje.className = "mensaje " + tipo;

    mensaje.textContent = texto;

    mensajes.insertBefore(
        mensaje,
        document.getElementById("escribiendo")
    );

    mensajes.scrollTop = mensajes.scrollHeight;
}


function generarRespuesta(texto) {

    const pregunta = texto.toLowerCase();

    if (
        pregunta.includes("hola") ||
        pregunta.includes("buenas")
    ) {
        return "¡Hola! 👋 Me alegra hablar contigo. ¿Qué quieres hacer hoy?";
    }

    if (
        pregunta.includes("cómo estás") ||
        pregunta.includes("como estas")
    ) {
        return "Estoy lista para ayudarte. 😊";
    }

    if (
        pregunta.includes("quién eres") ||
        pregunta.includes("quien eres")
    ) {
        return "Soy Mujer Virtual AI, una asistente virtual creada para conversar contigo.";
    }

    if (
        pregunta.includes("ayuda") ||
        pregunta.includes("puedes hacer")
    ) {
        return "Puedo conversar contigo, responder preguntas básicas y utilizar la función de voz de tu navegador.";
    }

    if (
        pregunta.includes("gracias")
    ) {
        return "¡De nada! 😊";
    }

    if (
        pregunta.includes("adiós") ||
        pregunta.includes("adios")
    ) {
        return "¡Hasta luego! 👋";
    }

    return "Interesante pregunta. Todavía estoy aprendiendo, pero pronto podré responder preguntas mucho más avanzadas.";
}


function teclaEnter(event) {

    if (event.key === "Enter") {
        enviarMensaje();
    }

}


function hablar() {

    if (!("webkitSpeechRecognition" in window) &&
        !("SpeechRecognition" in window)) {

        alert("Tu navegador no permite reconocimiento de voz.");

        return;
    }

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-ES";

    reconocimiento.start();

    reconocimiento.onresult = function(event) {

        const texto =
            event.results[0][0].transcript;

        document.getElementById("entrada").value = texto;

        enviarMensaje();
    };
}


function hablarTexto(texto) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    const voz = new SpeechSynthesisUtterance(texto);

    voz.lang = "es-ES";

    voz.rate = 1;

    voz.pitch = 1;

    speechSynthesis.speak(voz);
}

</script>

</body>
</html>
